name: Build Plyukh iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-organize folders
        run: |
          mkdir -p App Widget
          if [ -f "DomikPlyukhaApp.swift" ]; then mv DomikPlyukhaApp.swift App/; fi
          if [ -f "DomikPlyukhaWidget.swift" ]; then mv DomikPlyukhaWidget.swift Widget/; fi
          if [ -f "Info.plist" ]; then mv Info.plist Widget/; fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App & Widget
        run: |
          xcodebuild build \
            -project DomikPlyukha.xcodeproj \
            -scheme DomikPlyukha \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            SUPPORTED_PLATFORMS="iphoneos" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true

      - name: Sign Ad-Hoc & Package into .ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "DomikPlyukha.app" -type d | head -n 1)
          WIDGET_PATH=$(find build/Build/Products -name "DomikPlyukhaWidgetExtension.appex" -type d | head -n 1)
          mkdir -p "$APP_PATH/PlugIns"
          if [ -n "$WIDGET_PATH" ]; then
            cp -rf "$WIDGET_PATH" "$APP_PATH/PlugIns/"
            codesign --force --sign - --timestamp=none "$APP_PATH/PlugIns/DomikPlyukhaWidgetExtension.appex"
          fi
          codesign --force --sign - --timestamp=none "$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Plyukh_iOS_v7.1.ipa Payload

      - name: Upload Ready IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plyukh_iOS_IPA
          path: Plyukh_iOS_v7.1.ipa
